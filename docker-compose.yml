services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://crm_user:crm_password@db:5432/crm
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LOGO_URL: ${VITE_LOGO_URL}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  quotation-backend:
    build:
      context: .
      dockerfile: quotation-manager/backend/Dockerfile
    env_file:
      - .env
    environment:
      CRM_BACKEND_URL: http://backend:8000
      TENANT_FILES_ROOT: /app/tenant_files
    volumes:
      - ${TENANT_FILES_HOST_PATH}:/app/tenant_files
    depends_on:
      - backend
    expose:
      - "8000"
    restart: unless-stopped

  quotation-frontend:
    build:
      context: .
      dockerfile: quotation-manager/frontend/Dockerfile
      args:
        VITE_QUOTATION_API_BASE_URL: ${VITE_QUOTATION_API_BASE_URL}
    expose:
      - "80"
    depends_on:
      - quotation-backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
      - quotation-backend
      - quotation-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  postgres_data:
