upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

upstream quotation_backend {
    server quotation-backend:8000;
}

upstream quotation_frontend {
    server quotation-frontend:80;
}

server {
    listen 80;
    server_name ssi-crm.theworkpc.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ssi-crm.theworkpc.com;

    ssl_certificate /etc/letsencrypt/live/ssi-crm.theworkpc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssi-crm.theworkpc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachment uploads: 10MB per file, 25MB per message, plus multipart overhead.
        # nginx's 1MB default would reject these before FastAPI ever sees them.
        client_max_body_size 30m;
        proxy_request_buffering off;

        # Set explicitly rather than inheriting nginx's 60s default: several endpoints here
        # legitimately outlive it (WhatsApp history resync budgets 600s), and relying on the
        # default is what turned a slow-but-successful sync-all into a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /webhooks/ {
        proxy_pass http://backend/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inbound WhatsApp media arrives here base64-encoded from the whatsapp-service,
        # which posts through nginx via CRM_WHATSAPP_WEBHOOK_URL.
        client_max_body_size 40m;
    }

    location /quotation-api/ {
        proxy_pass http://quotation_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /quotation/ {
        proxy_pass http://quotation_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
